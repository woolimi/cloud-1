# /etc/nginx/nginx.conf
worker_processes auto;

error_log /var/log/nginx/error.log warn;
include /etc/nginx/modules/*.conf;

events {
	worker_connections 1024;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	proxy_headers_hash_max_size 1024;
	proxy_headers_hash_bucket_size 128;
	
	client_max_body_size 10m;
	ssl_protocols TLSv1.2 TLSv1.3;
	
	# Specifies the main log format.
	log_format main '$remote_addr - $remote_user [$time_local] "$request" '
			'$status $body_bytes_sent "$http_referer" '
			'"$http_user_agent" "$http_x_forwarded_for"';

	# Sets the path, format, and configuration for a buffered log write.
	access_log /var/log/nginx/access.log main;
	
	# Gzip Compression
	gzip on;
	gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
	gzip_min_length 256;
	gzip_comp_level 5;
	gzip_proxied any;
	gzip_vary on;
	gzip_disable "msie6";
	gzip_http_version 1.1;

	# Generate a session ID if none exists
    map $cookie_session_id $session_id {
        default $cookie_session_id;    # Use existing session ID if available
        "" $remote_addr$time_iso8601;  # Generate session ID if cookie doesn't exist
    }

	upstream wordpress {
		hash $session_id consistent;

		server wordpress1:8081 weight=1;
		server wordpress2:8082 weight=1;
	}

	server {
		listen 80;
		server_name knowledge-archive.xyz www.knowledge-archive.xyz;

		return 301 https://$host$request_uri;
	}

	server {
		listen 443 ssl;
		listen [::]:443 ssl;

    	server_name knowledge-archive.xyz www.knowledge-archive.xyz;
	
		root /var/www/html/wordpress;
	
		ssl_certificate /etc/nginx/ssl/fullchain.pem;
		ssl_certificate_key /etc/nginx/ssl/privkey.pem;

		rewrite ^([^.\?]*[^/])$ $1/ permanent;
		
		location / {
            if ($cookie_session_id = "") {
                add_header Set-Cookie "session_id=$session_id; Path=/; HttpOnly";
            }
			proxy_pass http://wordpress;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
    }
		location ^~ /phpmyadmin/ {
			proxy_pass http://phpmyadmin/;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}
	}
}