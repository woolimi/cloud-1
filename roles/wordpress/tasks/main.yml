---
- name: Create directory for WordPress
  file:
    path: /opt/wordpress
    state: directory

- name: Copy docker-compose.yml for WordPress setup
  copy:
    src: ./docker-compose.yml
    dest: /opt/wordpress/docker-compose.yml

- name: Launch WordPress and related services
  command: docker-compose -f /opt/wordpress/docker-compose.yml up -d
