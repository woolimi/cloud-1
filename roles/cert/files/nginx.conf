worker_processes 1;

events {
    worker_connections 1024;
}

http {
	server {
		listen 80;

		server_name knowledge-archive.xyz www.knowledge-archive.xyz;

		root /var/www/html;
		index index.html index.htm index.nginx-debian.html;

		location / {
				try_files $uri $uri/ =404;
		}

		location /.well-known/acme-challenge/ {
			root /var/www/html;
		}

		error_page 404 /404.html;
		location = /404.html {
				internal;
		}
	}
}