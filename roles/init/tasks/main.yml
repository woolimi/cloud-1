- name: Update and upgrade apt packages
  apt:
    update_cache: yes
    upgrade: dist

- name: Install basic packages
  apt:
    name:
      - curl
      - apt-transport-https
      - ca-certificates
      - software-properties-common
    state: present

- name: Delete built-in nginx
  ignore_errors: true
  shell:
    cmd: "pkill nginx && systemctl stop nginx && apt-get purge -y nginx nginx-common"